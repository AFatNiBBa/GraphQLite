# Settings of the embedded Neo4j used by Bench.java.
# Enterprise embedded starts the cluster services: their ports are moved to 127.0.0.2 so that they do not clash with
# a Neo4j server (for example Neo4j Desktop) running on the same machine.
server.config.strict_validation.enabled=false
server.default_listen_address=127.0.0.2
server.default_advertised_address=127.0.0.2
server.cluster.listen_address=127.0.0.2:16000
server.cluster.advertised_address=127.0.0.2:16000
server.cluster.raft.listen_address=127.0.0.2:17000
server.cluster.raft.advertised_address=127.0.0.2:17000
server.routing.listen_address=127.0.0.2:17688
server.routing.advertised_address=127.0.0.2:17688
server.backup.enabled=false
server.memory.pagecache.size=512m
